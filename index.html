<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makro-Dashboard</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* WSS Makro-Dashboard – Vorlage v2. Nur data/latest.json ändert sich, diese Datei bleibt gleich. */
:root{
  color-scheme:dark;
  --bg:#000;
  --ink:#F2EEE6; --ink-2:#A8A196; --ink-3:#8C867B;
  --gold:#C9A84F; --gold-hi:#F1DE9C; --gold-lo:#8E7633;
  --gold-grad:linear-gradient(120deg,#8E7633 0%,#B39A55 22%,#D6B65C 42%,#F1DE9C 52%,#D6B65C 62%,#B39A55 80%,#8E7633 100%);
  --up:#12A88A; --up-ink:#47D1AE; --down:#E85D45; --down-ink:#FF8A73; --flat:#8C877E; --flat-ink:#B5B0A6; --warn:#F2B544;
  --glass-top:rgba(255,255,255,.075); --glass-bot:rgba(255,255,255,.028);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --r:3px;
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.55;font-weight:400;font-stretch:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.num,.tab{font-variant-numeric:tabular-nums}
.na{color:var(--ink-3);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Hintergrundlicht hinter dem Glas */
.page{position:relative;isolation:isolate}
.ambient{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;display:block;border-radius:50%}
.ambient .g1{width:900px;height:700px;left:-280px;top:-260px;background:radial-gradient(closest-side,rgba(201,168,79,.30),rgba(201,168,79,.08) 55%,transparent)}
.ambient .g2{width:760px;height:620px;right:-300px;top:520px;background:radial-gradient(closest-side,rgba(214,182,92,.16),transparent 70%)}
.ambient .g3{width:900px;height:720px;left:-360px;top:44%;background:radial-gradient(closest-side,rgba(142,118,51,.22),transparent 70%)}
.ambient .g4{width:820px;height:640px;right:-320px;top:70%;background:radial-gradient(closest-side,rgba(201,168,79,.14),transparent 70%)}
.ambient .grid{position:absolute;inset:0;border-radius:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 640px);mask-image:linear-gradient(180deg,#000,transparent 640px)}

.shell{max-width:1240px;margin:0 auto;padding:0 16px 48px}
@media (min-width:720px){.shell{padding:0 28px 64px}}
@media (min-width:1100px){.shell{padding:0 40px 72px}}

/* Glas */
.glass{position:relative;background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 60px -32px rgba(0,0,0,.95);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
.glass.edge::before{content:"";position:absolute;left:10%;right:10%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--edge,rgba(241,222,156,.75)),transparent);pointer-events:none}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:36px;width:auto;display:block}
.mono{display:inline-grid;place-items:center;height:36px;padding:0 9px;border:1px solid rgba(201,168,79,.55);border-radius:2px;font-weight:750;font-stretch:125%;font-size:13px;letter-spacing:.06em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-weight:650;font-stretch:112%;font-size:16px;letter-spacing:.005em}
.brand-t span{font-size:12.5px;color:var(--ink-3)}
.stamp{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.stamp span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.stamp .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(18,168,138,.18)}
.stamp b{color:var(--ink);font-weight:600}

/* Hero */
.hero{display:grid;gap:22px;padding:34px 0 8px}
@media (min-width:1040px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:end;gap:44px;padding:56px 0 18px}.kw{font-size:clamp(110px,10.8vw,150px)}}
.kw{margin:0;line-height:.8;font-weight:640;font-stretch:125%;letter-spacing:-.045em;font-size:clamp(78px,21vw,150px);background:var(--gold-grad);background-size:220% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 2.4s cubic-bezier(.2,.7,.2,1) .15s both}
.kw small{display:block;font-size:.17em;letter-spacing:.02em;font-stretch:112%;font-weight:600;margin:0 0 .35em .08em;line-height:1}
@keyframes sheen{from{background-position:0 0;opacity:.0}25%{opacity:1}to{background-position:100% 0;opacity:1}}
.hero-r{display:grid;gap:16px;align-content:end}
.period{font-size:13px;color:var(--ink-2);font-stretch:112%;letter-spacing:.02em}
.headline{margin:0;font-size:clamp(19px,2.3vw,25px);line-height:1.38;font-weight:480;max-width:36ch;text-wrap:pretty}
.next{display:flex;align-items:center;gap:12px;padding:12px 14px;max-width:560px}
.next .when{font-weight:700;font-stretch:112%;font-size:14px;color:var(--gold-hi);white-space:nowrap}
.next .what{font-size:14px;color:var(--ink)}
.next .what small{display:block;color:var(--ink-2);font-size:12.5px}
.notes-top{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--ink-3);display:grid;gap:3px}

/* Abschnitte */
.sec{margin-top:60px}
@media (min-width:900px){.sec{margin-top:84px}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin:0 0 18px}
.sec-h h2{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.1;font-weight:620;font-stretch:118%;letter-spacing:-.02em}
.sec-h p{margin:0;font-size:13px;color:var(--ink-2)}
.sec-h p b{color:var(--ink);font-weight:600}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:680;font-stretch:112%;font-size:12px;line-height:1;letter-spacing:.05em;padding:6px 8px 6px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:1px;background:currentColor}
.badge.up{color:var(--up-ink);border-color:rgba(18,168,138,.55);background:rgba(18,168,138,.12)}
.badge.down{color:var(--down-ink);border-color:rgba(232,93,69,.55);background:rgba(232,93,69,.12)}
.badge.flat{color:var(--flat-ink);border-color:rgba(181,176,166,.38);background:rgba(181,176,166,.08)}
.badge.gold{color:#140f02;border-color:transparent;background:var(--gold-grad);background-size:160% 100%}
.badge.gold::before{background:#140f02}
.badge.lg{font-size:14px;padding:8px 10px 8px 9px}

/* Makro-Kacheln */
.tiles{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1120px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:14px;padding:20px 20px 16px;min-width:0}
.tile[data-tone="up"]{--edge:rgba(71,209,174,.8)}
.tile[data-tone="down"]{--edge:rgba(255,138,115,.8)}
.tile[data-tone="flat"]{--edge:rgba(181,176,166,.6)}
.tile[data-tone="gold"]{--edge:rgba(241,222,156,.9)}
.tile-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile-h h3{margin:0;font-size:14px;line-height:1.25;font-weight:600;color:var(--ink-2)}
.tile-h h3 span{display:block;color:var(--ink-3);font-weight:500;font-size:12.5px}
.big{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.big .v{font-size:40px;line-height:1;font-weight:600;font-stretch:106%;letter-spacing:-.025em}
.big .v.word{font-size:34px;font-stretch:118%;letter-spacing:-.02em;font-weight:700}
.big .u{font-size:20px;color:var(--ink-2);font-weight:500;margin-left:-6px}
.chg{font-size:14.5px;font-weight:650;white-space:nowrap}
.chg.up{color:var(--up-ink)}.chg.down{color:var(--down-ink)}.chg.flat{color:var(--flat-ink)}
.sub{font-size:12.5px;color:var(--ink-3);margin-top:-8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:6px 8px;border:1px solid var(--line);border-radius:2px;color:var(--ink-2);background:rgba(0,0,0,.25)}
.chip b{font-weight:600;color:var(--ink)}
.tri{font-size:9px;line-height:1}
.tri.up{color:var(--up-ink)}.tri.down{color:var(--down-ink)}.tri.flat{color:var(--flat-ink)}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.pts li{position:relative;padding-left:14px}
.pts li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:1px;background:var(--gold)}
.ind{display:grid;gap:0;margin:0;padding:0;list-style:none;font-size:13px}
.ind li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2)}
.ind li:first-child{border-top:0;padding-top:0}
.ind .sg{width:8px;height:8px;border-radius:50%}
.sg.off{background:var(--down)}.sg.on{background:var(--up)}.sg.neutral{background:var(--flat)}
.ind .n{color:var(--ink-2);min-width:0;line-height:1.3}
.ind .val{color:var(--ink);font-weight:550}
.ind .c{color:var(--ink-2);min-width:62px;text-align:right}
.concl{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.fw{display:grid;gap:7px}
.fw-t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2)}
.fw-bar{display:flex;gap:2px;height:10px}
.fw-bar i{display:block;height:100%;border-radius:1px}
.fw-bar .hike{background:var(--gold)}.fw-bar .hold{background:var(--flat)}.fw-bar .cut{background:var(--up)}
.fw-l{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.fw-l b{color:var(--ink);font-weight:650}
.fw-l i{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;vertical-align:0}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;color:var(--ink);text-align:right;font-weight:550}
.info-btn{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border:1px solid rgba(201,168,79,.38);border-radius:2px;background:rgba(201,168,79,.07);color:var(--gold-hi);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.info-btn:hover{background:rgba(201,168,79,.14);border-color:rgba(201,168,79,.6)}
.info-btn .chev{width:9px;height:9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.info-btn[aria-expanded="true"]{background:rgba(201,168,79,.16);border-color:rgba(201,168,79,.7)}
.info-btn[aria-expanded="true"] .chev{transform:rotate(-135deg) translate(-2px,-2px)}

/* Glossar-Panel */
.gloss{grid-column:1/-1;padding:22px 20px 20px;border-color:rgba(201,168,79,.45);animation:open .32s cubic-bezier(.2,.7,.2,1)}
.gloss::after{content:"";position:absolute;top:-7px;left:var(--nx,40px);width:12px;height:12px;background:#17150f;border-left:1px solid rgba(201,168,79,.45);border-top:1px solid rgba(201,168,79,.45);transform:translateX(-50%) rotate(45deg)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.gloss-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
.gloss-h h3{margin:0;font-size:19px;font-weight:620;font-stretch:112%;letter-spacing:-.01em}
.x{flex:none;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.3);cursor:pointer}
.x::before,.x::after{content:"";position:absolute;width:14px;height:1.5px;background:var(--ink-2)}
.x{position:relative}.x::before{transform:rotate(45deg)}.x::after{transform:rotate(-45deg)}
.gloss-lead{margin:0 0 16px;max-width:78ch;color:var(--ink-2);font-size:14px}
.states{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.states{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:859px){.state.is-current{order:-1}}
.state{position:relative;padding:16px 16px 14px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
.state.is-current{border-color:rgba(201,168,79,.75);background:linear-gradient(180deg,rgba(201,168,79,.10),rgba(0,0,0,.25));box-shadow:inset 0 0 0 1px rgba(201,168,79,.18)}
.state-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.now{font-size:11.5px;font-weight:650;color:#140f02;background:var(--gold);padding:4px 7px;border-radius:2px;letter-spacing:.02em}
.state h4{margin:0;font-size:15px;font-weight:620}
.state p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.imp{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr;gap:0;font-size:13px}
.imp li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line-2)}
.imp .a{color:var(--ink);min-width:0}
.imp .a small{color:var(--ink-3);font-size:11.5px;margin-left:5px}
.imp .t{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.t.up{color:var(--up-ink)}.t.down{color:var(--down-ink)}.t.flat,.t.mixed{color:var(--flat-ink)}
.howto{margin:16px 0 0;padding:12px 14px;border-left:2px solid var(--gold);background:rgba(201,168,79,.06);font-size:13.5px;color:var(--ink)}
.howto b{color:var(--gold-hi);font-weight:650}
.fine{margin:10px 0 0;font-size:12.5px;color:var(--ink-3)}

/* Termine: Wochenleiste */
.week{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:960px){.week{grid-template-columns:repeat(5,minmax(0,1fr))}}
.day{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.is-today{border-color:rgba(201,168,79,.6)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line-2)}
.day-h b{font-weight:650;font-stretch:112%;font-size:15px}
.day-h span{font-size:12.5px;color:var(--ink-3)}
.day.is-today .day-h span{color:#140f02;background:var(--gold);padding:3px 6px;border-radius:2px;font-weight:650}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:2px 0}
.ev+.ev{border-top:1px solid var(--line-2);padding-top:10px}
.ev .tm{font-weight:650;font-size:13px;color:var(--ink);min-width:42px}
.ev .tl{font-size:13.5px;line-height:1.4;color:var(--ink);min-width:0}
.ev .meta{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.cur{font-weight:650;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line);padding:2px 5px;border-radius:2px;letter-spacing:.03em}
.imp-b{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.imp-b i{display:block;width:3px;background:rgba(255,255,255,.18);border-radius:1px}
.imp-b i:nth-child(1){height:5px}.imp-b i:nth-child(2){height:7.5px}.imp-b i:nth-child(3){height:10px}
.imp-b.high i{background:var(--gold)}
.imp-b.medium i:nth-child(-n+2){background:var(--gold)}
.imp-b.info i:nth-child(1){background:var(--ink-3)}
.ev .fc{grid-column:2;font-size:12px;color:var(--ink-2)}
.ev .nt{grid-column:2;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.ev.past{opacity:.45}
.ev.hl .tl{color:var(--gold-hi)}
.empty{font-size:12.5px;color:var(--ink-3)}
.foot-note{margin:12px 0 0;font-size:13px;color:var(--ink-2)}

/* COT */
.cot-h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:-4px 0 16px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 10px;border-radius:2px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink-2)}
.pill.gold{border-color:rgba(201,168,79,.6);color:var(--gold-hi);background:rgba(201,168,79,.08)}
.pill b{font-weight:650;color:inherit}
.cot-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1000px){.cot-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}}
.panel{padding:16px 16px 14px;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:550;color:var(--ink-3);font-size:12px;text-align:left;padding:0 8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .code{font-weight:700;font-stretch:112%;letter-spacing:.02em}
.tbl .nm{display:block;font-size:11.5px;color:var(--ink-3);font-weight:450;letter-spacing:0;font-stretch:100%}
.tbl .pos{color:var(--up-ink)}.tbl .neg{color:var(--down-ink)}
.ix{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ix span{min-width:40px;text-align:right}
.meter{position:relative;flex:1 1 auto;max-width:88px;min-width:52px;height:6px;background:rgba(255,255,255,.07);border-radius:1px;overflow:visible}
.meter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:20%;background:rgba(232,93,69,.28)}
.meter::after{content:"";position:absolute;right:0;top:0;bottom:0;width:20%;background:rgba(18,168,138,.28)}
.meter i{position:absolute;top:-3px;width:3px;height:12px;border-radius:1px;background:var(--ink);transform:translateX(-50%);z-index:1}
.ext{font-size:14px}
.tbl .w{width:28px;text-align:center}
.cnotes{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;color:var(--ink-3);max-width:110ch}
@media (max-width:560px){.tbl .nm{display:none}.meter{display:none}.tbl td,.tbl th{padding-left:5px;padding-right:5px}}
.bars{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;height:34px;outline-offset:1px;cursor:default}
.brow .lb{font-weight:700;font-stretch:112%;font-size:13px;color:var(--ink-2)}
.track{position:relative;height:100%}
.track::before{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:rgba(255,255,255,.35)}
.bar{position:absolute;top:50%;height:14px;transform:translateY(-50%)}
.bar.l{left:50%;background:var(--up);border-radius:0 4px 4px 0}
.bar.s{right:50%;background:var(--down);border-radius:4px 0 0 4px}
.bv{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-2);white-space:nowrap}
.brow:hover .bar,.brow:focus-visible .bar{filter:brightness(1.18)}
.brow:hover .lb,.brow:focus-visible .lb{color:var(--ink)}
.gridl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.axis{position:relative;height:18px;margin-left:52px;font-size:11.5px;color:var(--ink-3)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:260px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--ink);background:rgba(16,14,10,.94);border:1px solid rgba(201,168,79,.45);border-radius:2px;box-shadow:0 18px 40px -16px #000;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:650}
/* COT: Diagrammzeilen auf Tabellenzeilen ausrichten */
@media (min-width:1000px){.tbl td{height:58px;padding-top:0;padding-bottom:0}.tbl th{height:46px;padding-bottom:0;vertical-align:middle}.legend{height:46px;align-items:center;margin:0;border-bottom:1px solid var(--line)}.brow{height:58px}.bars{gap:0}.brow+.brow{border-top:1px solid var(--line-2)}}

/* Bias */
.scale{padding:18px 16px 14px;margin-bottom:14px}
.scale-t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.scale-track{position:relative;height:var(--h,64px)}
.scale-track .base{position:absolute;left:0;right:0;bottom:22px;height:1px;background:rgba(255,255,255,.18)}
.scale-track .zone-l{position:absolute;right:0;bottom:22px;height:1px;width:calc(100%/6*1.5);background:var(--up)}
.scale-track .zone-s{position:absolute;left:0;bottom:22px;height:1px;width:calc(100%/6*1.5);background:var(--down)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);text-align:center}
.tick::before{content:"";display:block;width:1px;height:7px;background:rgba(255,255,255,.3);margin:0 auto 5px}
.sc{position:absolute;transform:translateX(-50%);font-weight:700;font-stretch:112%;font-size:12px;padding:4px 7px;border-radius:2px;border:1px solid;background:rgba(0,0,0,.55);white-space:nowrap;line-height:1.1}
.sc.LONG{color:var(--up-ink);border-color:rgba(18,168,138,.6)}
.sc.SHORT{color:var(--down-ink);border-color:rgba(232,93,69,.6)}
.sc.NEUTRAL{color:var(--flat-ink);border-color:rgba(181,176,166,.4)}
.bias-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.bias-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1040px){.bias-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bcard{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;min-width:0}
.bcard[data-bias="LONG"]{--edge:rgba(71,209,174,.8)}
.bcard[data-bias="SHORT"]{--edge:rgba(255,138,115,.8)}
.bcard[data-bias="NEUTRAL"]{--edge:rgba(181,176,166,.5)}
.b-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b-id{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.b-id b{font-size:22px;font-weight:700;font-stretch:118%;letter-spacing:-.01em}
.b-id span{font-size:12.5px;color:var(--ink-3)}
.lab{font-weight:750;font-stretch:118%;font-size:24px;letter-spacing:.01em;line-height:1}
.lab.LONG{color:var(--up-ink)}.lab.SHORT{color:var(--down-ink)}.lab.NEUTRAL{color:var(--flat-ink)}
.lab-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

.str.LONG i.on{background:var(--up)}.str.SHORT i.on{background:var(--down)}.str.NEUTRAL i.on{background:var(--flat)}
.reason{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.fac{margin:0;padding:0;list-style:none;display:grid;gap:0;font-size:12.5px}
.fac li{display:grid;grid-template-columns:78px 26px minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line-2)}
.fac .k{color:var(--ink-3)}
.fac .s{font-weight:700;text-align:center}
.fac .s.p{color:var(--up-ink)}.fac .s.m{color:var(--down-ink)}.fac .s.z{color:var(--flat-ink)}

.warn{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:#F7D58C;padding:8px 10px;border:1px solid rgba(242,181,68,.35);background:rgba(242,181,68,.07);border-radius:2px}

/* Paare */
.pairs-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.pairs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1160px){.pairs-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pair{display:flex;flex-direction:column;gap:12px;padding:20px 18px 16px;min-width:0}
.pair-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rank{font-size:46px;line-height:.8;font-weight:700;font-stretch:125%;color:transparent;-webkit-text-stroke:1px rgba(201,168,79,.75);letter-spacing:-.04em}
.pair.btc .rank{font-size:15px;line-height:1;-webkit-text-stroke:0;color:var(--gold-hi);font-weight:650;font-stretch:112%;letter-spacing:.02em;padding:6px 8px;border:1px solid rgba(201,168,79,.5);border-radius:2px}
.pair h3{margin:0;font-size:28px;line-height:1;font-weight:700;font-stretch:118%;letter-spacing:-.02em}
.legs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:12.5px}
.leg{padding:7px 8px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.3);text-align:center}
.leg b{display:block;font-size:14px;font-weight:700;font-stretch:112%}
.leg.LONG b{color:var(--up-ink)}.leg.SHORT b{color:var(--down-ink)}.leg.NEUTRAL b{color:var(--flat-ink)}
.leg span{color:var(--ink-3)}
.vs{color:var(--ink-3);font-size:12px}
.divg{font-size:12.5px;color:var(--ink-2)}
.divg b{color:var(--gold-hi);font-weight:700}
.pair.btc{border-color:rgba(201,168,79,.42)}

/* Fuß */
.foot{margin-top:72px;display:grid;gap:14px}
@media (min-width:960px){.foot{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.src{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:13px}
.src li{display:flex;justify-content:space-between;gap:12px;padding-bottom:7px;border-bottom:1px solid var(--line-2)}
.src a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(201,168,79,.35)}
.src a:hover{border-bottom-color:var(--gold)}
.src span{color:var(--ink-3);white-space:nowrap;font-size:12px}
.foot h2{margin:0 0 12px;font-size:17px;font-weight:620;font-stretch:112%}
.disc{padding:18px;border-color:rgba(201,168,79,.5)}
.disc p{margin:0;font-size:14.5px;line-height:1.55}
.disc .meta{margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.dnotes{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.err{margin:60px 0;padding:22px;font-size:15px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.kw{background-position:60% 0}}

/* ---------- Bausteine ---------- */
function smaChips(m){
  function one(lbl, above, val){
    if(above === true || above === false){
      var t = above ? "up" : "down";
      return '<li class="chip"><span class="tri ' + t + '">' + ARW[t] + "</span>" + (above ? "über " : "unter ") + lbl + (isNum(val) ? ' <b class="num">' + (m.approx ? "≈ " : "") + fmt(val, m.decimals) + "</b>" : "") + "</li>";
    }
    return '<li class="chip">' + lbl + " " + NA + "</li>";
  }
  return '<ul class="chips">' + one("SMA20", m.above_sma20, m.sma20) + one("SMA50", m.above_sma50, m.sma50) + "</ul>";
}
function pts(list){ if(!list || !list.length) return ""; return '<ul class="pts">' + list.map(function(p){ return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>"; }
function infoBtn(key){ return '<button type="button" class="info-btn" data-info="' + key + '" aria-expanded="false" aria-controls="gloss">Was bedeutet das?<span class="chev" aria-hidden="true"></span></button>'; }

function tilePrice(key, m){
  if(!m) m = {};
  var st = m.status, t = STATUS_TONE[st] || "flat";
  var unit = m.unit ? '<span class="u">' + esc(m.unit) + "</span>" : "";
  var chg = isNum(m.change_pct) ? '<span class="chg ' + tone(m.change_pct) + '">' + fmtS(m.change_pct, 1, " %") + "</span>" : '<span class="chg flat">' + NA + "</span>";
  var extras = "";
  if(m.extras && m.extras.length){
    extras = '<dl class="kv">' + m.extras.map(function(x){ return "<dt>" + esc(x.label) + '</dt><dd class="num">' + txt(x.value) + "</dd>"; }).join("") + "</dl>";
  }
  return '<article class="tile glass edge" data-tone="' + t + '" data-key="' + key + '">' +
    '<div class="tile-h"><h3>' + esc(m.name || "") + "<span>" + esc(m.symbol || "") + "</span></h3>" + badge(st) + "</div>" +
    '<div class="big"><span class="v num">' + fmt(m.value, m.decimals) + "</span>" + unit + chg + "</div>" +
    '<div class="sub">' + txt(m.value_label) + (m.change_label ? ", Veränderung " + esc(m.change_label) : "") + "</div>" +
    smaChips(m) + extras + pts(m.points) + infoBtn(key) + "</article>";
}
function tileRegime(m){
  if(!m) m = {};
  var t = STATUS_TONE[m.status] || "flat";
  var ind = (m.indicators || []).map(function(x){
    var sg = x.signal === "on" ? "on" : x.signal === "off" ? "off" : "neutral";
    var lab = sg === "on" ? "Risk-on-Signal" : sg === "off" ? "Risk-off-Signal" : "neutrales Signal";
    return '<li><span class="sg ' + sg + '" role="img" aria-label="' + lab + '"></span><span class="n">' + esc(x.name) + '</span><span class="val num">' + txt(x.value) + '</span><span class="c num">' + txt(x.change) + "</span></li>";
  }).join("");
  return '<article class="tile glass edge" data-tone="' + t + '" data-key="regime">' +
    '<div class="tile-h"><h3>Marktregime<span>Risiko oder Sicherheit</span></h3>' + badge(m.status) + "</div>" +
    '<div class="big"><span class="v word" style="color:var(--' + (t === "up" ? "up-ink" : t === "down" ? "down-ink" : "flat-ink") + ')">' + txt(m.status) + "</span></div>" +
    '<div class="sub">' + txt(m.score_label) + "</div>" +
    '<ul class="ind">' + ind + "</ul>" +
    (m.conclusion ? '<p class="concl">' + esc(m.conclusion) + "</p>" : "") + infoBtn("regime") + "</article>";

function tileFed(m){
  if(!m) m = {};

  var fwHtml = "";

function weekHtml(d){
  var ev = (d.termine || []).slice().filter(function(e){ return e && e.date; });
  var now = berlinNow();
  var anchor = (d.meta && d.meta.created ? String(d.meta.created).slice(0,10) : (ev[0] ? ev[0].date : now.date));
  var dow = isoDay(anchor).getUTCDay();
  var monday = addDays(anchor, dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow);
  var days = [0,1,2,3,4].map(function(i){ return addDays(monday, i); });
  var cols = days.map(function(day){
    var list = ev.filter(function(e){ return e.date === day; }).sort(function(a,b){ return (a.time || "00:00").localeCompare(b.time || "00:00"); });
    var today = day === now.date;
    var items = list.map(function(e){
      var stamp = e.date + "T" + (e.time || "23:59");
      var past = stamp < now.date + "T" + now.time;
      var imp = e.impact === "high" ? "high" : e.impact === "medium" ? "medium" : "info";
      var impTxt = imp === "high" ? "hoch" : imp === "medium" ? "mittel" : "Info";
      var fc = (e.forecast || e.previous) ? '<div class="fc">' + (e.forecast ? "Prognose " + esc(e.forecast) : "") + (e.forecast && e.previous ? ", " : "") + (e.previous ? "vorher " + esc(e.previous) : "") + "</div>" : "";
      return '<div class="ev' + (past ? " past" : "") + (imp === "high" ? " hl" : "") + '"><span class="tm num">' + (e.time ? esc(e.time) : "ganztg.") + '</span><span class="tl">' + esc(e.title) + "</span>" +
        '<span class="meta"><span class="cur">' + esc(e.cur || "") + '</span><span class="imp-b ' + imp + '" aria-hidden="true"><i></i><i></i><i></i></span><span>' + (imp === "info" ? "Info" : "Relevanz " + impTxt) + "</span>" + (past ? "<span>vorbei</span>" : "") + "</span>" + fc +
        (e.note ? '<span class="nt">' + esc(e.note) + "</span>" : "") + "</div>";
    }).join("");
    return '<section class="day glass' + (today ? " is-today" : "") + '"><div class="day-h"><b>' + wd(day) + " " + dm(day) + "</b>" + (today ? "<span>Heute</span>" : (list.length ? "<span>" + list.length + (list.length === 1 ? " Termin" : " Termine") + "</span>" : "")) + "</div>" + (items || '<span class="empty">Keine Top-Termine</span>') + "</section>";
  }).join("");
  return '<div class="week">' + cols + "</div>" + (d.termine_note ? '<p class="foot-note">' + esc(d.termine_note) + "</p>" : "");
}

function nextEvent(d){

  for(var i = 0; i < list.length; i++){

      return '<div class="next glass edge"><span class="when num">' + esc(when) + '</span><span class="what">' + esc((e.cur ? e.cur + " " : "") + e.title) + (e.forecast ? "<small>Prognose " + esc(e.forecast) + "</small>" : "") + "</span></div>";
    }

function cotHtml(c){
  if(!c) c = {};
  var es = c.entries || [];
  var ap = c.index_approx ? "≈ " : "";
  var rows = es.map(function(e){
    var ix = isNum(e.cot_index) ? Math.max(0, Math.min(100, e.cot_index)) : null;
    var ext = e.extreme === "long" || e.extreme === "short";
    var chg = isNum(e.change) ? '<span class="' + (e.change > 0 ? "pos" : e.change < 0 ? "neg" : "") + '"><span class="tri ' + tone(e.change) + '" aria-hidden="true">' + (e.change > 0 ? ARW.up : e.change < 0 ? ARW.down : ARW.flat) + "</span> " + fmtS(e.change, 0) + "</span>" : NA;
    return "<tr><td><span class=\"code\">" + esc(e.code) + '<span class="nm">' + esc(e.name || "") + "</span></span></td>" +
      '<td class="r num ' + (isNum(e.net) ? (e.net >= 0 ? "pos" : "neg") : "") + '">' + fmtS(e.net, 0) + "</td>" +
      '<td class="r num">' + chg + "</td>" +
      '<td class="r"><span class="ix">' + (ix === null ? "" : '<span class="meter" aria-hidden="true"><i style="left:' + ix + '%"></i></span>') + '<span class="num">' + (ix === null ? NA : ap + Math.round(ix) + " %") + "</span></span></td>" +
      '<td class="w">' + (ext ? '<span class="ext" role="img" aria-label="Extrem ' + (e.extreme === "long" ? "oben" : "unten") + '">⚠️</span>' : "") + "</td></tr>";
  }).join("");
  var tbl = '<table class="tbl"><caption class="sr">COT-Positionierung der Großspekulanten</caption><thead><tr><th scope="col">Markt</th><th scope="col" class="r">Netto</th><th scope="col" class="r">Δ Woche</th><th scope="col" class="r">COT-Index</th><th scope="col" class="w"><span class="sr">Extrem</span>⚠️</th></tr></thead><tbody>' + rows + "</tbody></table>";

  var max = 0; es.forEach(function(e){ if(isNum(e.net)) max = Math.max(max, Math.abs(e.net)); });
  var step = max > 120000 ? 50000 : max > 60000 ? 25000 : max > 20000 ? 10000 : 5000;
  var lim = Math.max(step, Math.ceil(max / step) * step);
  function k(v){ return (v === 0 ? "0" : (v > 0 ? "+" : MINUS) + Math.round(Math.abs(v) / 1000) + "k"); }
  var grid = "", axis = "";
  for(var v = -lim; v <= lim; v += step){ var pos = 50 + v / lim * 50; if(v !== 0) grid += '<span class="gridl" style="left:' + pos + '%"></span>'; if(Math.abs(v) % (step * (lim / step > 3 ? 2 : 1)) === 0 || v === 0) axis += '<span style="left:' + pos + '%">' + k(v) + "</span>"; }
  var bars = es.map(function(e, i){
    if(!isNum(e.net)) return '<div class="brow"><span class="lb">' + esc(e.code) + '</span><div class="track">' + grid + '<span class="bv" style="left:calc(50% + 8px)">' + NA + "</span></div></div>";
    var w = Math.abs(e.net) / lim * 50, l = e.net >= 0;
    var lbl = k(e.net);
    var bv = l ? '<span class="bv num" style="left:calc(' + (50 + w) + '% + 6px)">' + lbl + "</span>" : '<span class="bv num" style="right:calc(' + (50 + w) + '% + 6px)">' + lbl + "</span>";
    return '<div class="brow" tabindex="0" data-i="' + i + '" aria-label="' + esc(e.code) + ": netto " + (l ? "long " : "short ") + fmt(Math.abs(e.net), 0) + ' Kontrakte"><span class="lb">' + esc(e.code) + '</span><div class="track">' + grid + '<span class="bar ' + (l ? "l" : "s") + '" style="width:' + Math.max(w, .4) + '%"></span>' + bv + "</div></div>";
  }).join("");
  var chart = '<div class="legend"><span><i style="background:var(--up)"></i>Netto-Long</span><span><i style="background:var(--down)"></i>Netto-Short</span><span>Kontrakte, Stichtag ' + txt(c.stichtag_label) + '</span></div><div class="bars" id="bars">' + bars + '</div><div class="axis" aria-hidden="true">' + axis + "</div>";
  var notes = (c.notes || []).map(function(n){ return "<li>" + esc(n) + "</li>"; }).join("");
  return '<div class="cot-h"><span class="pill gold">Stichtag <b>' + txt(c.stichtag_label) + '</b></span><span class="pill">Veröffentlicht ' + txt(c.published_label) + '</span><span class="pill">Nächster Bericht ' + txt(c.next_label) + "</span></div>" +
    '<div class="cot-grid"><div class="panel glass">' + tbl + '</div><div class="panel glass">' + chart + "</div></div>" + (notes ? '<ul class="cnotes">' + notes + "</ul>" : "");
}

function biasSorted(d){
  return (d.bias || []).slice().map(function(b, i){ b._i = i; return b; }).sort(function(a, b){ var sa = isNum(a.score) ? a.score : 0, sb = isNum(b.score) ? b.score : 0; return sb - sa || a._i - b._i; });
}
function scaleHtml(list){
  var cols = {}; list.forEach(function(b){ var s = isNum(b.score) ? Math.max(-3, Math.min(3, b.score)) : 0; (cols[s] = cols[s] || []).push(b); });
  var maxStack = 1; Object.keys(cols).forEach(function(k){ maxStack = Math.max(maxStack, cols[k].length); });
  var h = 30 + maxStack * 26;
  var chips = ""; Object.keys(cols).forEach(function(k){ var s = +k; cols[k].forEach(function(b, j){ chips += '<span class="sc ' + esc(b.bias) + '" style="left:' + ((s + 3) / 6 * 100) + "%;bottom:" + (32 + j * 26) + 'px">' + esc(b.asset) + "</span>"; }); });
  var ticks = ""; for(var s = -3; s <= 3; s++){ ticks += '<span class="tick num" style="left:' + ((s + 3) / 6 * 100) + '%">' + (s > 0 ? "+" + s : s < 0 ? MINUS + Math.abs(s) : "0") + "</span>"; }
  return '<div class="scale glass" role="img" aria-label="Stärke-Skala der Wochen-Bias von minus 3 bis plus 3"><div class="scale-t"><span>Stärkste Short</span><span>Score</span><span>Stärkste Long</span></div><div class="scale-track" style="--h:' + h + 'px"><span class="base"></span><span class="zone-s"></span><span class="zone-l"></span>' + ticks + chips + "</div></div>";
}
function strBars(b){ var s = isNum(b.score) ? Math.min(3, Math.abs(b.score)) : 0; var o = ""; for(var i = 1; i <= 3; i++) o += '<i class="' + (i <= s ? "on" : "") + '"></i>'; return '<span class="str ' + esc(b.bias) + '" aria-hidden="true">' + o + "</span>"; }
function facRow(k, f){ if(!f) return ""; var s = isNum(f.score) ? f.score : null; var c = s > 0 ? "p" : s < 0 ? "m" : "z"; return '<li><span class="k">' + k + '</span><span class="s ' + c + ' num">' + (s === null ? NA : (s > 0 ? "+" + s : s < 0 ? MINUS + Math.abs(s) : "0")) + '</span><span class="d">' + txt(f.label) + "</span></li>"; }
function biasHtml(d){
  var list = biasSorted(d);
  var cards = list.map(function(b){
    var f = b.factors || {};
    var sc = isNum(b.score) ? (b.score > 0 ? "+" + b.score : b.score < 0 ? MINUS + Math.abs(b.score) : "0") : "N/A";
    return '<article class="bcard glass edge" data-bias="' + esc(b.bias) + '"><div class="b-h"><div class="b-id"><b>' + esc(b.asset) + "</b><span>" + esc(b.name || "") + '</span></div><div class="lab-wrap"><span class="lab ' + esc(b.bias) + '">' + esc(b.bias || "N/A") + "</span>" + strBars(b) + '<span class="sr">Score ' + sc + "</span></div></div>" +
      '<p class="reason">' + txt(b.reason) + '</p><ul class="fac">' + facRow("COT", f.cot) + facRow("Notenbank", f.cb) + facRow("Regime", f.regime) + '<li><span class="k">Score</span><span class="s ' + (b.score > 0 ? "p" : b.score < 0 ? "m" : "z") + ' num">' + sc + '</span><span class="d">' + (b.bias === "LONG" ? "ab +2 Long" : b.bias === "SHORT" ? "ab −2 Short" : "zwischen −1 und +1 neutral") + "</span></li></ul>" +
      (b.warning ? '<p class="warn"><span aria-hidden="true">⚠️</span><span>' + esc(b.warning) + "</span></p>" : "") + "</article>";
  }).join("");
  return scaleHtml(list) + '<div class="bias-grid">' + cards + "</div>";
}

function legsInOrder(p){
  var parts = String(p.pair || "").split("/");
  if(parts.length === 2 && parts[0] && parts[1]) return [parts[0].trim(), parts[1].trim()];
  return [p.long_leg, p.short_leg];
}
function pairCard(p, btc, d){
  if(!p) return "";
  var sc = {}; (d.bias || []).forEach(function(b){ sc[b.asset] = b; });
  function leg(code){ var b = sc[code] || {}; var s = isNum(b.score) ? (b.score > 0 ? "+" + b.score : b.score < 0 ? MINUS + Math.abs(b.score) : "0") : ""; return '<div class="leg ' + esc(b.bias || "NEUTRAL") + '"><b>' + esc(code) + "</b><span>" + esc(b.bias || "") + (s ? " " + s : "") + "</span></div>"; }
  return '<article class="pair glass edge' + (btc ? " btc" : "") + '"><div class="pair-h"><span class="rank" aria-hidden="true">' + (btc ? "Bitcoin" : esc(p.rank)) + "</span>" + badge(p.direction, "lg") + "</div>" +
    "<h3>" + (btc ? "" : '<span class="sr">Platz ' + esc(p.rank) + ": </span>") + esc(p.pair) + "</h3>" +
    '<div class="legs">' + legsInOrder(p).map(leg).join('<span class="vs">gegen</span>') + "</div>" +
    '<div class="divg">Divergenz <b class="num">' + (isNum(p.divergence) ? p.divergence : "N/A") + "</b> Punkte</div>" +
    '<p class="reason">' + txt(p.reason) + "</p>" + (p.warning ? '<p class="warn"><span aria-hidden="true">⚠️</span><span>' + esc(p.warning) + "</span></p>" : "") + "</article>";
}

function placeGloss(){
  if(!OPEN) return;
  var grid = document.getElementById("tiles"), panel = document.getElementById("gloss");
  var tiles = Array.prototype.slice.call(grid.querySelectorAll(".tile"));
  var tile = grid.querySelector('.tile[data-key="' + OPEN + '"]'); if(!tile) return;
  var idx = tiles.indexOf(tile);
  var cols = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
  var end = Math.min(tiles.length - 1, Math.floor(idx / cols) * cols + cols - 1);
  if(tiles[end].nextElementSibling !== panel) tiles[end].after(panel);
  var g = grid.getBoundingClientRect(), t = tile.getBoundingClientRect();
  panel.style.setProperty("--nx", Math.round(t.left - g.left + t.width / 2) + "px");
}
function toggleGloss(key, btn){
  var panel = document.getElementById("gloss");
  var btns = document.querySelectorAll(".info-btn");
  if(OPEN === key){ closeGloss(); return; }
  OPEN = key;
  var mk = DATA.makro || {}; var cur = (mk[key] || {}).status;
  panel.innerHTML = glossHtml(key, cur);
  panel.hidden = false;
  Array.prototype.forEach.call(btns, function(b){ b.setAttribute("aria-expanded", b.getAttribute("data-info") === key ? "true" : "false"); });
  placeGloss();
  var h = document.getElementById("gloss-title"); if(h) h.focus({ preventScroll: true });
  var r = panel.getBoundingClientRect();
  if(r.top < 0 || r.top > window.innerHeight - 120){ try { panel.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch(e){} }
  postHeight();
}
function closeGloss(){
  var panel = document.getElementById("gloss"); var key = OPEN; OPEN = null;
  panel.hidden = true; panel.innerHTML = "";
  Array.prototype.forEach.call(document.querySelectorAll(".info-btn"), function(b){ b.setAttribute("aria-expanded", "false"); });
  var b = document.querySelector('.info-btn[data-info="' + key + '"]'); if(b) b.focus({ preventScroll: true });
  postHeight();
}

function wire(){
  document.getElementById("app").addEventListener("click", function(e){
    var b = e.target.closest(".info-btn"); if(b){ toggleGloss(b.getAttribute("data-info"), b); return; }
    if(e.target.closest("[data-close]")) closeGloss();
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && OPEN) closeGloss(); });
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ placeGloss(); postHeight(); }, 120); });
  // Tooltip am COT-Diagramm
  var tip = document.getElementById("tip"), bars = document.getElementById("bars"), es = (DATA.cot && DATA.cot.entries) || [];
  function show(row, x, y){
    var e = es[+row.getAttribute("data-i")]; if(!e) return;
    var ix = isNum(e.cot_index) ? (DATA.cot.index_approx ? "≈ " : "") + Math.round(e.cot_index) + " %" : "N/A";
    tip.innerHTML = "<b>" + esc(e.code) + "</b> " + esc(e.name || "") + "<br>Netto " + (e.net >= 0 ? "long " : "short ") + fmt(Math.abs(e.net), 0) + " Kontrakte<br>Veränderung " + fmtS(e.change, 0) + "<br>COT-Index " + ix + (e.extreme ? "<br>⚠️ Extrem" : "");
    tip.classList.add("on");
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + "px";
    tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h - 12)) + "px";
  }
  if(bars){
    bars.addEventListener("mousemove", function(e){ var r = e.target.closest(".brow[data-i]"); if(r) show(r, e.clientX, e.clientY); else tip.classList.remove("on"); });
    bars.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
    bars.addEventListener("focusin", function(e){ var r = e.target.closest(".brow[data-i]"); if(r){ var b = r.getBoundingClientRect(); show(r, b.left + b.width / 2, b.top); } });
    bars.addEventListener("focusout", function(){ tip.classList.remove("on"); });
  }
}

/* Höhe an die einbettende Seite melden (Memberspot-iFrame) */
var lastH = 0;
function postHeight(){
  try {
    var el = document.querySelector(".page");
    var h = Math.ceil(el ? el.getBoundingClientRect().height : document.documentElement.scrollHeight);
    if(Math.abs(h - lastH) > 2 && window.parent && window.parent !== window){ lastH = h; window.parent.postMessage({ type: "wss-makro-height", height: h }, "*"); }
  } catch(e){}
}
if("ResizeObserver" in window){ new ResizeObserver(function(){ postHeight(); }).observe(document.querySelector(".page")); }
window.addEventListener("load", postHeight);

/* Logo: meta.logo_url oder assets/logo.png (nur online), sonst Monogramm */
function setLogo(meta, standalone){
  var img = document.getElementById("logo"), mono = document.getElementById("mono");
  var url = safeUrl(meta && meta.logo_url) || (standalone ? null : "assets/logo.png");
  if(!url || img.getAttribute("src")) return;
  img.addEventListener("load", function(){ img.hidden = false; mono.hidden = true; postHeight(); });
  img.addEventListener("error", function(){ img.hidden = true; mono.hidden = false; });
  img.src = url;
}

/* Daten laden: eingebettetes JSON (Einzeldatei) oder data/latest.json (GitHub Pages) */
function fail(msg){ document.getElementById("app").innerHTML = '<p class="err glass">' + esc(msg) + "</p>"; postHeight(); }
var embedded = document.getElementById("dashboard-data").textContent.trim();
if(embedded.charAt(0) === "{"){
  try { var d0 = JSON.parse(embedded); setLogo(d0.meta, true); render(d0); } catch(e){ fail("Die eingebetteten Daten sind fehlerhaft: " + e.message); }
} else {
  fetch(DATA_URL + "?v=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d){ setLogo(d.meta, false); render(d); })
    .catch(function(e){ fail("Die Daten konnten nicht geladen werden (" + e.message + "). Bitte die Seite neu laden."); });
}
})();
</script>
